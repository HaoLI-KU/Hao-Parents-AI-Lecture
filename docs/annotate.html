\/p>\n<h2>用 Harness 生成房间软装图<\/h2>\n<p>建议安排：配置 Seedream / 火山方舟，跑通生图、改图和软装对比。<\/p>\n<span class=\"route-enter\">打开练习 <span aria-hidden=\"true\">→<\/span><\/span>\n<\/a><\/div><\/section>\n<section class=\"wrap home-section\"><div class=\"section-head\"><div class=\"section-title\"><p class=\"eyebrow\">怎么用<\/p><h2>三步开始<\/h2><\/div><\/div>\n<div class=\"card-grid\">\n<article class=\"card\"><span class=\"card-kicker\">01<\/span><h3>选自己的路线<\/h3><p>爸爸和妈妈各自从自己的课表开始，课次不要求同步。第一次来，先看一节里要做什么。<\/p><\/article>\n<article class=\"card\"><span class=\"card-kicker\">02<\/span><h3>按步骤动手<\/h3><p>每节先写清输入、步骤和预期结果。需要提示词时，照提示词块里的文字发给 AI，再自己操作。<\/p><\/article>\n<article class=\"card\"><span class=\"card-kicker\">03<\/span><h3>亲手核对<\/h3><p>AI 说得通顺不等于事情做对。打开原文件、原网页或 PDF，对照检查后再进入下一步。<\/p><\/article>\n<\/div><\/section>"}, "mom": {"title": "妈妈的课程", "html": "<section class=\"hero hero-route route-mom\"><div class=\"wrap\">\n<p class=\"eyebrow\">学习路线 · Mac 基础 · 豆包 · DeepSeek/Harness<\/p>\n<h1>妈妈的课程<\/h1>\n<p class=\"lead\">先把新 Mac、会议、邮件和家庭共享用顺，再按爸爸第 1–3 节完成 DeepSeek 与 Harness 的 AI 入门。<\/p>\n<p class=\"hero-meta\"><span class=\"chip\">7 节<\/span><\/p>\n<\/div><\/section>\n<section class=\"wrap lesson-section\">\n<div class=\"section-head\"><div class=\"section-title\"><p class=\"eyebrow\">正在进行<\/p><h2>课程进度<\/h2><\/div><span class=\"section-note\">7 节<\/span><\/div>\n<div class=\"lesson-list\"><a class=\"lesson-row\" href=\"#mom/lesson-01\"><span class=\"lesson-num\" lang=\"en-GB\">Lesson 01<\/span><span class=\"lesson-main\"><span class=\"lesson-title\">新 Mac 联网后先装豆包桌面版，试语音通话和屏幕共享，再更新和验证入会<\/span><span class=\"lesson-tags\"><\/span><\/span><span class=\"lesson-arrow\" aria-hidden=\"true\">→<\/span><\/a><a class=\"lesson-row\" href=\"#mom/lesson-02\"><span class=\"lesson-num\" lang=\"en-GB\">Lesson 02<\/span><span class=\"lesson-main\"><span class=\"lesson-title\">安装应用、配邮箱并核对同步<\/span><span class=\"lesson-tags\"><\/span><\/span><span class=\"lesson-arrow\" aria-hidden=\"true\">→<\/span><\/a><a class=\"lesson-row\" href=\"#mom/lesson-03\"><span class=\"lesson-num\" lang=\"en-GB\">Lesson 03<\/span><span class=\"lesson-main\"><span class=\"lesson-title\">快捷键和触控板，验证共享日历、备忘录和相册<\/span><span class=\"lesson-tags\"><\/span><\/span><span class=\"lesson-arrow\" aria-hidden=\"true\">→<\/span><\/a><a class=\"lesson-row\" href=\"#mom/lesson-04\"><span class=\"lesson-num\" lang=\"en-GB\">Lesson 04<\/span><span class=\"lesson-main\"><span class=\"lesson-title\">会议预约与分享、语音输入、MacTeX 验证<\/span><span class=\"lesson-tags\"><\/span><\/span><span class=\"lesson-arrow\" aria-hidden=\"true\">→<\/span><\/a><a class=\"lesson-row\" href=\"#mom/lesson-05\"><span class=\"lesson-num\" lang=\"en-GB\">Lesson 05<\/span><span class=\"lesson-main\"><span class=\"lesson-title\">按爸爸第 1 节：认识 AI 与 DeepSeek/Codex<\/span><span class=\"lesson-tags\"><\/span><\/span><span class=\"lesson-arrow\" aria-hidden=\"true\">→<\/span><\/a><a class=\"lesson-row\" href=\"#mom/lesson-06\"><span class=\"lesson-num\" lang=\"en-GB\">Lesson 06<\/span><span class=\"lesson-main\"><span class=\"lesson-title\">按爸爸第 2 节：安装与初始化 Harness<\/span><span class=\"lesson-tags\"><\/span><\/span><span class=\"lesson-arrow\" aria-hidden=\"true\">→<\/span><\/a><a class=\"lesson-row\" href=\"#mom/lesson-07\"><span class=\"lesson-num\" lang=\"en-GB\">Lesson 07<\/span><span class=\"lesson-main\"><span class=\"lesson-title\">按爸爸第 3 节：推理强度、用量与查网页/日历<\/span><span class=\"lesson-tags\"><\/span><\/span><span class=\"lesson-arrow\" aria-hidden=\"true\">→<\/span><\/a><\/div>\n<\/section>\n<section class=\"wrap lesson-section\">\n<a class=\"practice-card\" href=\"#practice\">\n<p class=\"eyebrow\">共同练习 · 2 项<\/p>\n<h2>GitHub 与 Seedream 生图<\/h2>\n<p>GitHub 先备用；Seedream 生图建议安排，用来跑通 Harness 生图、改图和软装对比。<\/p>\n<span class=\"route-enter\">打开共同练习 <span aria-hidden=\"true\">→<\/span><\/span>\n<\/a>\n<\/section>"}, "mom/lesson-01": {"title": "把新 Mac 设置到能上远程课", "html": "<article class=\"lesson-page route-mom\"><div class=\"wrap\">\n<nav class=\"breadcrumb\" aria-label=\"面包屑\"><a href=\"#mom\">妈妈的课程<\/a><span aria-hidden=\"true\">/<\/span><span>第 1 节<\/span><\/nav>\n<header class=\"lesson-hero\">\n<p class=\"eyebrow\"><span lang=\"en-GB\">Lesson 01<\/span> · 妈妈 <\/p>\n<h1>把新 Mac 设置到能上远程课<\/h1><p class=\"lesson-summary\">新 Mac 联网后先装豆包桌面版，试语音通话和屏幕共享，再更新和验证入会<\/p>\n<\/header>\n<div class=\"lesson-layout\">\n<aside class=\"toc\" aria-label=\"本节步骤\"><p class=\"toc-title\">本节步骤<\/p><nav class=\"toc-nav\"><a href=\"#step-1\"><span class=\"toc-num\">01<\/span><span>新 Mac 联网后先装豆包桌面版<\/span><\/a><a href=\"#step-2\"><span class=\"toc-num\">02<\/span><span>检查更新，先把下载排起来<\/span><\/a><a href=\"#step-3\"><span class=\"toc-num\">03<\/span><span>登录 Apple 账户，检查 App Store 更新<\/span><\/a><a href=\"#step-4\"><span class=\"toc-num\">04<\/span><span>安装腾讯会议，并亲手进会<\/span><\/a><\/nav><\/aside>\n<div class=\"lesson-body\" id=\"mom\"><p>本课按 macOS 27 编写。<\/p>\n<h2 id=\"step-1\">1. 新 Mac 联网后先装豆包桌面版<\/h2>\n<ol>\n<li>接电开机，按提示设置 Mac 登录密码并连网，打开 Safari。<\/li>\n<li>打开<a href=\"https://www.doubao.com/download/desktop?ug_utm_source=101\" target=\"_blank\" rel=\"noopener\">下载豆包桌面版（Mac）<\/a>，选 Mac 版。下载后在 Finder 的「下载」里打开安装文件，按提示安装。从「应用程序」打开豆包并登录。<\/li>\n<li>在豆包桌面客户端先拨通语音通话，再从通话界面开启屏幕共享。若 macOS 提示授权，按提示在「系统设置 → 隐私与安全性」为豆包开启麦克风和屏幕录制相关权限（名称随 macOS 版本变化，例如「录屏与系统录音」），必要时重新打开客户端。按钮名称以现场版本为准。<\/li>\n<li>打开「系统设置」，对着 Mac 说：「请看我现在共享的画面。我想检查系统更新，请只告诉我下一步。」妈妈自己照着点，再让豆包按新画面给下一步。按豆包的说明，它会在收到指令时截取当时的共享画面。<a href=\"https://www.doubao.com/legal/privacy\" target=\"_blank\" rel=\"noopener\">豆包隐私政策<\/a><\/li>\n<li>做完停止共享并结束通话。进入账号验证或私人页面前先停共享。若通话或共享入口暂时不可用，记下卡点，先继续设置，第 2 节再补验收。<\/li>\n<\/ol>\n<h2 id=\"step-2\">2. 检查更新，先把下载排起来<\/h2>\n<ol>\n<li>打开「系统设置 → 通用 → 软件更新」。若安装需要重启，先看看等待时间。今天优先保证腾讯会议能入会，可先启动下载，或等入会测试后再重启。更新结束后重新检查这一页。<\/li>\n<li>从 Safari 打开<a href=\"https://meeting.tencent.com/download/index.html\" target=\"_blank\" rel=\"noopener\">下载腾讯会议（Mac）<\/a>，选 macOS，先下载它。打开 Safari 的下载列表或 Finder 的「下载」目录，确认文件已下载完成。<\/li>\n<li>同时从 <a href=\"https://www.tug.org/mactex/mactex-download.html\" target=\"_blank\" rel=\"noopener\">MacTeX 下载页<\/a>找到 MacTeX 安装包。它是大文件，网络和磁盘空间允许时让它先下载，等候期间做下面的设置。如果网络慢，先保腾讯会议和系统更新，MacTeX 可留在课间继续。<\/li>\n<li>用同样方法找到 <a href=\"https://www.google.com/chrome/\" target=\"_blank\" rel=\"noopener\">Chrome<\/a>和<a href=\"https://mac.weixin.qq.com/\" target=\"_blank\" rel=\"noopener\">微信 Mac 版<\/a>。优先下载后面马上用到的微信和 Chrome。DeepSeek Harness 留到妈妈开始 AI 课程时再按当时的官方入口安装。官方下载或使用入口暂时不可用时，记下卡在哪一步，继续其他项目。<\/li>\n<\/ol>\n<h2 id=\"step-3\">3. 登录 Apple 账户，检查 App Store 更新<\/h2>\n<ol>\n<li>打开「系统设置」，点左上方 Apple 账户入口，用自己的账户登录并在自己的设备上完成验证。<\/li>\n<li>打开账户下的 iCloud 页面，核对日历、备忘录和照片等本次要使用的同步项目。家庭共享邀请与应用里的实际显示在第 3 节检查。邮箱账户在第 2 节另行添加。<\/li>\n<li>打开 App Store，点边栏的「更新」。如有待更新的应用，先更新马上要用的。其余在网络空闲时继续。回到更新页确认所选项目已完成。系统更新负责 Safari、备忘录等系统内建 App 的更新。App Store 的「更新」针对从商店获得的 App。<\/li>\n<\/ol>\n<h2 id=\"step-4\">4. 安装腾讯会议，并亲手进会<\/h2>\n<ol>\n<li>在 Finder 的「下载」打开官方安装文件。若是 <code>.dmg<\/code>，先打开，再看里面是可拖入「应用程序」的 App，还是要双击运行的安装器。若是 <code>.pkg<\/code>，双击后按安装器的提示继续。<\/li>\n<li>到 Finder 的「应用程序」打开腾讯会议。点家人发的测试邀请，开关麦克风，请对方确认声音。选择一个练习窗口共享，再停止。若被要求授予权限，按提示到「系统设置 → 隐私与安全性」检查麦克风或屏幕录制权限，按应用提示重新打开并试一次。<\/li>\n<li>退出会议，再用原邀请重新进会。Mac 还在更新时，先用手机验证能加入，再把 Mac 入会留作待办。<\/li>\n<li>打开「文本编辑」，写一行测试文字，试 <code>⌘C<\/code> 复制、<code>⌘V<\/code> 粘贴、<code>⌘S<\/code> 保存。把文件存到「文稿」，关闭后用 Finder 找回。<\/li>\n<\/ol>\n<p>本节以能入会为优先。豆包试一次即可，其余软件先排下载，来不及就到第 2 节再安装。给每项软件记一个状态：待下载、下载中、已安装、已打开验证。<\/p>\n<p>备查：<a href=\"https://support.apple.com/zh-cn/108382\" target=\"_blank\" rel=\"noopener\">Apple 软件更新<\/a> · <a href=\"https://support.apple.com/zh-cn/102629\" target=\"_blank\" rel=\"noopener\">App Store 手动更新<\/a> · <a href=\"https://support.apple.com/zh-cn/guide/mac-help/mchl211c911f/mac\" target=\"_blank\" rel=\"noopener\">Apple 隐私与安全设置<\/a> · <a href=\"https://meeting.tencent.com/support/topic/1758/\" target=\"_blank\" rel=\"noopener\">腾讯会议桌面端指南<\/a> · <a href=\"https://api-docs.deepseek.com/zh-cn/faq/\" target=\"_blank\" rel=\"noopener\">DeepSeek 平台常见问题<\/a><\/p><\/div>\n<\/div>\n<nav class=\"lesson-pager\" aria-label=\"课次导航\">\n<span class=\"pager-link is-empty\" aria-hidden=\"true\"><\/span>\n<a class=\"pager-link pager-home\" href=\"#mom\"><span class=\"pager-label\">课表<\/span><span class=\"pager-title\">返回妈妈的课程<\/span><\/a>\n<a class=\"pager-link\" href=\"#mom/lesson-02\"><span class=\"pager-label\">下一节<\/span><span class=\"pager-title\">第 2 节<\/span><\/a>\n<\/nav>\n<\/div><\/article>"}, "mom/lesson-02": {"title": "先验收应用，再做邮件和基础操作", "html": "<article class=\"lesson-page route-mom\"><div class=\"wrap\">\n<nav class=\"breadcrumb\" aria-label=\"面包屑\"><a href=\"#mom\">妈妈的课程<\/a><span aria-hidden=\"true\">/<\/span><span>第 2 节<\/span><\/nav>\n<header class=\"lesson-hero\">\n<p class=\"eyebrow\"><span lang=\"en-GB\">Lesson 02<\/span> · 妈妈 <\/p>\n<h1>先验收应用，再做邮件和基础操作<\/h1><p class=\"lesson-summary\">安装应用、配邮箱并核对同步<\/p>\n<\/header>\n<div class=\"lesson-layout\">\n<aside class=\"toc\" aria-label=\"本节步骤\"><p class=\"toc-title\">本节步骤<\/p><nav class=\"toc-nav\"><a href=\"#step-1\"><span class=\"toc-num\">01<\/span><span>检查应用和远程入会<\/span><\/a><a href=\"#step-2\"><span class=\"toc-num\">02<\/span><span>添加邮箱并验证同步<\/span><\/a><\/nav><\/aside>\n<div class=\"lesson-body\" id=\"mom\"><h2 id=\"step-1\">检查应用和远程入会<\/h2>\n<ol>\n<li>从上节链接进会。打开「下载」目录，逐项检查上节的状态。先完成系统重启和腾讯会议验证，再继续安装。<\/li>\n<li><strong>Chrome<\/strong>：打开官方安装文件，按窗口提示放入「应用程序」，再从那里打开，访问一个已知网页。<strong>微信<\/strong>：同样打开官方安装文件，安装后从「应用程序」打开，按提示用手机确认登录。先检查能看到聊天列表。<\/li>\n<li><strong>复用 Mac 版豆包<\/strong>：在 Mac 上发起豆包语音通话并共享练习画面，问「请看我现在的画面。我想找到邮件的获取设置，下一步点哪里？」照建议做一步，再停止共享。进入真实账户页面前先停共享。上节若没走通，先补麦克风和屏幕共享。<\/li>\n<li><strong>MacTeX<\/strong>：下载结束后，从「下载」双击官方 <code>.pkg<\/code>，按安装器提示继续。成功后打开「应用程序」里的 TeX 工具目录，尝试启动 TeXShop。若仍在下载，就先做邮件。<\/li>\n<\/ol>\n<h2 id=\"step-2\">添加邮箱并验证同步<\/h2>\n<ol>\n<li><strong>添加网易 126 邮箱。<\/strong> 打开苹果「邮件 → 添加账户」，输入妈妈完整的 <code>@126.com<\/code> 邮箱地址。已添加的账号可在「邮件 → 设置 → 账户」查看。<\/li>\n<li><strong>如果验证失败，检查客户端授权。<\/strong> 打开<a href=\"https://www.126.com/\" target=\"_blank\" rel=\"noopener\">网易 126 网页邮箱<\/a>并登录。在设置中找 POP3/SMTP/IMAP 或客户端授权相关选项，按网页提示检查 IMAP/SMTP 并生成授权码。先停止屏幕共享，再由妈妈将授权码填入苹果「邮件」的密码栏。菜单名称以实际账户界面为准。 <a href=\"https://help.mail.163.com/\" target=\"_blank\" rel=\"noopener\">网易邮箱帮助<\/a><\/li>\n<li><strong>验证双向同步。<\/strong> 从苹果「邮件」发一封测试邮件，在 126 网页邮箱的「已发送」里找同一主题。请家人回复，再回苹果「邮件」查看回信。需要调整检查频率时，打开「邮件 → 设置 → 通用 → 检查新邮件」。<\/li>\n<\/ol>\n<p>快捷键和触控板集中放到第 3 节。<\/p>\n<p>做不完时，先确保会议和邮件可用，记录还没验证的软件和动作。<\/p>\n<p>备查：<a href=\"https://support.apple.com/zh-cn/guide/mail/mail35803/mac\" target=\"_blank\" rel=\"noopener\">Apple 添加邮件账户<\/a> · <a href=\"https://support.apple.com/zh-cn/guide/mail/cpmlprefgen/mac\" target=\"_blank\" rel=\"noopener\">Apple 邮件通用设置<\/a> · <a href=\"https://www.tug.org/mactex/gui-link.html\" target=\"_blank\" rel=\"noopener\">MacTeX 的 TeXShop 位置<\/a><\/p><\/div>\n<\/div>\n<nav class=\"lesson-pager\" aria-label=\"课次导航\">\n<a class=\"pager-link\" href=\"#mom/lesson-01\"><span class=\"pager-label\">上一节<\/span><span class=\"pager-title\">第 1 节<\/span><\/a>\n<a class=\"pager-link pager-home\" href=\"#mom\"><span class=\"pager-label\">课表<\/span><span class=\"pager-title\">返回妈妈的课程<\/span><\/a>\n<a class=\"pager-link\" href=\"#mom/lesson-03\"><span class=\"pager-label\">下一节<\/span><span class=\"pager-title\">第 3 节<\/span><\/a>\n<\/nav>\n<\/div><\/article>"}, "mom/lesson-03": {"title": "先练快捷操作，再打开家庭共享", "html": "<article class=\"lesson-page route-mom\"><div class=\"wrap\">\n<nav class=\"breadcrumb\" aria-label=\"面包屑\"><a href=\"#mom\">妈妈的课程<\/a><span aria-hidden=\"true\">/<\/span><span>第 3 节<\/span><\/nav>\n<header class=\"lesson-hero\">\n<p class=\"eyebrow\"><span lang=\"en-GB\">Lesson 03<\/span> · 妈妈 <\/p>\n<h1>先练快捷操作，再打开家庭共享<\/h1><p class=\"lesson-summary\">快捷键和触控板，验证共享日历、备忘录和相册<\/p>\n<\/header>\n<div class=\"lesson-layout\">\n<aside class=\"toc\" aria-label=\"本节步骤\"><p class=\"toc-title\">本节步骤<\/p><nav class=\"toc-nav\"><a href=\"#step-1\"><span class=\"toc-num\">01<\/span><span>快捷键和触控板<\/span><\/a><a href=\"#step-2\"><span class=\"toc-num\">02<\/span><span>验证日历、备忘录和相簿<\/span><\/a><\/nav><\/aside>\n<div class=\"lesson-body\" id=\"mom\"><h2 id=\"step-1\">快捷键和触控板<\/h2>\n<p>打开测试文稿，逐项试 <code>⌘C<\/code> 复制、<code>⌘V<\/code> 粘贴、<code>⌘S<\/code> 保存、<code>⌘W<\/code> 关窗口、<code>⌘Q<\/code> 退出、<code>⇧⌘4<\/code> 区域截图。打开触控板设置，在「更多手势」看本机演示。练上滑打开「调度中心」、左右滑切换全屏 App 或桌面空间、拇指与三指张开显示桌面。若本机有「启动台」捏合手势再试它。没有这个选项就用聚焦查找并打开 App。<\/p>\n<h2 id=\"step-2\">验证日历、备忘录和相簿<\/h2>\n<p>快捷操作试过后，再检查家庭共享。当天来不及就从下一个项目接着做。<\/p>\n<ol>\n<li>打开苹果「日历」，找一条家人已经共享的日程。新建一个有开始和结束时间的测试日程，选家人共享且自己有编辑权限的 iCloud 日历，请家人在另一台设备确认能看到。<\/li>\n<li>用自己的 Apple 账户开启 iCloud 备忘录，接受共享邀请，再在「备忘录」的 iCloud 列表找之前共享的三条。看不到时，核对邀请所用的邮件地址或电话号码是否关联到自己的 Apple 账户。打开课程使用计划和另外两条家庭备忘录，确认正文能显示。真实名称由家人现场确认。<\/li>\n<li>家里用的是 Apple「共享相簿」。在 macOS 27 的「照片 → 设置 → iCloud」检查「iCloud 照片」和「共享相簿」已开启。接受家人的相簿邀请后，在「照片」边栏的「共享」部分找到相簿，打开一张家人分享的照片。 <a href=\"https://support.apple.com/zh-cn/124160\" target=\"_blank\" rel=\"noopener\">Apple 共享相簿指南<\/a>\n遇到陌生菜单，可以在 Mac 版豆包里发起语音通话并共享练习画面，再问一小步。共享日历是否同步，以家人在自己设备上看到的结果为准。<\/li>\n<\/ol>\n<p>备查：<a href=\"https://support.apple.com/zh-cn/102650\" target=\"_blank\" rel=\"noopener\">Apple 键盘快捷键<\/a> · <a href=\"https://support.apple.com/zh-cn/102482\" target=\"_blank\" rel=\"noopener\">触控板手势<\/a> · <a href=\"https://support.apple.com/zh-hans/guide/calendar/icl32362/mac\" target=\"_blank\" rel=\"noopener\">共享日历<\/a> · <a href=\"https://support.apple.com/zh-cn/guide/notes/apd4e6e2c9a6/mac\" target=\"_blank\" rel=\"noopener\">备忘录协作<\/a> · <a href=\"https://support.apple.com/zh-cn/124160\" target=\"_blank\" rel=\"noopener\">共享相簿<\/a> · <a href=\"https://support.apple.com/zh-cn/123926\" target=\"_blank\" rel=\"noopener\">共享照片图库<\/a><\/p><\/div>\n<\/div>\n<nav class=\"lesson-pager\" aria-label=\"课次导航\">\n<a class=\"pager-link\" href=\"#mom/lesson-02\"><span class=\"pager-label\">上一节<\/span><span class=\"pager-title\">第 2 节<\/span><\/a>\n<a class=\"pager-link pager-home\" href=\"#mom\"><span class=\"pager-label\">课表<\/span><span class=\"pager-title\">返回妈妈的课程<\/span><\/a>\n<a class=\"pager-link\" href=\"#mom/lesson-04\"><span class=\"pager-label\">下一节<\/span><span class=\"pager-title\">第 4 节<\/span><\/a>\n<\/nav>\n<\/div><\/article>"}, "mom/lesson-04": {"title": "验证会议预约、语音输入和 MacTeX", "html": "<article class=\"lesson-page route-mom\"><div class=\"wrap\">\n<nav class=\"breadcrumb\" aria-label=\"面包屑\"><a href=\"#mom\">妈妈的课程<\/a><span aria-hidden=\"true\">/<\/span><span>第 4 节<\/span><\/nav>\n<header class=\"lesson-hero\">\n<p class=\"eyebrow\"><span lang=\"en-GB\">Lesson 04<\/span> · 妈妈 <\/p>\n<h1>验证会议预约、语音输入和 MacTeX<\/h1><p class=\"lesson-summary\">会议预约与分享、语音输入、MacTeX 验证<\/p>\n<\/header>\n<div class=\"lesson-layout\">\n<aside class=\"toc\" aria-label=\"本节步骤\"><p class=\"toc-title\">本节步骤<\/p><nav class=\"toc-nav\"><a href=\"#step-1\"><span class=\"toc-num\">01<\/span><span>预定会议并同步日历<\/span><\/a><a href=\"#step-2\"><span class=\"toc-num\">02<\/span><span>试微信语音转文字<\/span><\/a><a href=\"#step-3\"><span class=\"toc-num\">03<\/span><span>验证 MacTeX<\/span><\/a><\/nav><\/aside>\n<div class=\"lesson-body\" id=\"mom\"><p>先补前几节没完成、今天会用到的项目。腾讯会议、微信和 Apple 账户能打开后，再做下面的练习。<\/p>\n<h2 id=\"step-1\">预定会议并同步日历<\/h2>\n<ol>\n<li>在腾讯会议 Mac 客户端主页点「预定会议」，填主题和时间，再点「预定」。从会议详情或邀请菜单复制会议号和链接。把日期、时区与链接通过邮件发给约好的家人，请对方核对在哥本哈根看到的时间。<\/li>\n<li>在苹果「日历」建立测试日程，用日程右上角的彩色标记选一个自己可编辑的共享日历。双击日程，在「添加备注、URL 或附件」贴入会议链接。需要指定时区时，在「日历 → 设置 → 高级」打开时区支持，再点日程日期选择上海时区。请家人在哥本哈根用自己的设备核对当地开始时间，并打开链接确认是同一场会议。 <a href=\"https://support.apple.com/zh-hans/guide/calendar/icalwr13-events/mac\" target=\"_blank\" rel=\"noopener\">Apple 添加和修改日程<\/a><\/li>\n<\/ol>\n<h2 id=\"step-2\">试微信语音转文字<\/h2>\n<p>优先练微信 Mac 客户端自带的语音转文字。打开一个测试聊天，把光标放在输入框，找语音输入的小话筒或客户端显示的快捷键。试说「明天给薄荷浇水，check the leaves」。确认中英文出现在可编辑的输入框，核对后清空。入口以现场客户端版本为准。如果只有发送语音消息的按钮，先请家人一起检查版本和设置。macOS 听写作为备用，可在「系统设置 → 键盘 → 听写」查看启用方式和快捷键。<\/p>\n<h2 id=\"step-3\">验证 MacTeX<\/h2>\n<p>本节只用 Mac 上已经装好的 TeXShop，不需要 DeepSeek Harness。<\/p>\n<ol>\n<li>下载<a href=\"assets/lessons/04/examples/chinese-manual.zip\" download>中文手册练习项目（ZIP）<\/a>和<a href=\"assets/lessons/04/examples/mom-mactex-test.tex\" download>测试文件<\/a>。把 ZIP 解压到「文稿」，测试文件也放到同一个「文稿」位置。<\/li>\n<li>双击测试文件，TeXShop 会打开它。点工具栏的「排版」（Typeset），等预览窗口出现。若能看到「MacTeX 练习」和下面那行中文，说明中文编译环境可用。<\/li>\n<li>在 TeXShop 里打开解压后的 <code>chinese-manual/main.tex<\/code>。文件第一行指定 XeLaTeX，按「排版」编译；第一次目录可能为空，再按一次「排版」更新目录。<\/li>\n<li>在预览里核对封面、目录，以及「准备设备」「记录与复查」两个中文章节。看到本次生成的 PDF 就完成本节验证；妈妈本节不做 PDF 批注。<\/li>\n<li>若排版报错，先看 TeXShop 日志窗口的第一条错误，记下文件名和提示。确认 MacTeX 已安装、TeXShop 是从「应用程序」打开的；修不了就记下错误，下节课一起看。<\/li>\n<\/ol>\n<p>如仍有待完成的基础操作，记下从哪一步接着做。豆包桌面版继续按需使用。工具选择与提示词的系统练习留到第 5、6 节。<\/p>\n<p>备查：<a href=\"https://meeting.tencent.com/support/topic/392/index.html\" target=\"_blank\" rel=\"noopener\">腾讯会议预定常规会议<\/a> · <a href=\"https://support.apple.com/zh-cn/guide/mac-help/-kbdm162/mac\" target=\"_blank\" rel=\"noopener\">Apple 听写设置<\/a> · <a href=\"https://www.tug.org/mactex/gui-link.html\" target=\"_blank\" rel=\"noopener\">MacTeX 图形工具<\/a><\/p><\/div>\n<\/div>\n<nav class=\"lesson-pager\" aria-label=\"课次导航\">\n<a class=\"pager-link\" href=\"#mom/lesson-03\"><span class=\"pager-label\">上一节<\/span><span class=\"pager-title\">第 3 节<\/span><\/a>\n<a class=\"pager-link pager-home\" href=\"#mom\"><span class=\"pager-label\">课表<\/span><span class=\"pager-title\">返回妈妈的课程<\/span><\/a>\n<a class=\"pager-link\" href=\"#mom/lesson-05\"><span class=\"pager-label\">下一节<\/span><span class=\"pager-title\">第 5 节<\/span><\/a>\n<\/nav>\n<\/div><\/article>"}, "mom/lesson-05": {"title": "认识 AI：按爸爸第 1 节做", "html": "<article class=\"lesson-page route-mom\"><div class=\"wrap\">\n<nav class=\"breadcrumb\" aria-label=\"面包屑\"><a href=\"#mom\">妈妈的课程<\/a><span aria-hidden=\"true\">/<\/span><span>第 5 节<\/span><\/nav>\n<header class=\"lesson-hero\">\n<p class=\"eyebrow\"><span lang=\"en-GB\">Lesson 05<\/span> · 妈妈 <\/p>\n<h1>认识 AI：按爸爸第 1 节做<\/h1><p class=\"lesson-summary\">按爸爸第 1 节：认识 AI 与 DeepSeek/Codex<\/p>\n<\/header>\n<div class=\"lesson-layout no-toc\">\n\n<div class=\"lesson-body\" id=\"mom\"><p>这一节和爸爸第 1 节是同一份内容。打开<a href=\"#dad/lesson-01\">爸爸第 1 节<\/a>，按那里的步骤做；账户、API Key 和登录都用自己的，不要用爸爸的密钥。<\/p>\n<ol>\n<li>先读爸爸第 1 节的「用两层来理解 AI」，用自己的话说出界面和模型的分工。<\/li>\n<li>按爸爸第 1 节创建或登录自己的 DeepSeek 开放平台账户，按页面提示小额充值。<\/li>\n<li>创建自己的 API Key，接到这台 Mac 的 Codex 上，发一条测试，再回开放平台核对用量。若这台 Mac 还没有 Codex，先和爸爸一起按第 1 节的入口装好。<\/li>\n<li>完成后记下卡住的一步；下一节用 Harness 继续。<\/li>\n<\/ol>\n<p>备查：<a href=\"https://platform.deepseek.com/\" target=\"_blank\" rel=\"noopener\">DeepSeek 开放平台<\/a> · <a href=\"https://api-docs.deepseek.com/zh-cn/quick_start/agent_integrations/codex/\" target=\"_blank\" rel=\"noopener\">DeepSeek Codex 接入说明<\/a><\/p><\/div>\n<\/div>\n<nav class=\"lesson-pager\" aria-label=\"课次导航\">\n<a class=\"pager-link\" href=\"#mom/lesson-04\"><span class=\"pager-label\">上一节<\/span><span class=\"pager-title\">第 4 节<\/span><\/a>\n<a class=\"pager-link pager-home\" href=\"#mom\"><span class=\"pager-label\">课表<\/span><span class=\"pager-title\">返回妈妈的课程<\/span><\/a>\n<a class=\"pager-link\" href=\"#mom/lesson-06\"><span class=\"pager-label\">下一节<\/span><span class=\"pager-title\">第 6 节<\/span><\/a>\n<\/nav>\n<\/div><\/article>"}, "mom/lesson-06": {"title": "安装与初始化 Harness：按爸爸第 2 节做", "html": "<article class=\"lesson-page route-mom\"><div class=\"wrap\">\n<nav class=\"breadcrumb\" aria-label=\"面包屑\"><a href=\"#mom\">妈妈的课程<\/a><span aria-hidden=\"true\">/<\/span><span>第 6 节<\/span><\/nav>\n<header class=\"lesson-hero\">\n<p class=\"eyebrow\"><span lang=\"en-GB\">Lesson 06<\/span> · 妈妈 <\/p>\n<h1>安装与初始化 Harness：按爸爸第 2 节做<\/h1><p class=\"lesson-summary\">按爸爸第 2 节：安装与初始化 Harness<\/p>\n<\/header>\n<div class=\"lesson-layout no-toc\">\n\n<div class=\"lesson-body\" id=\"mom\"><p>打开<a href=\"#dad/lesson-02\">爸爸第 2 节<\/a>，按那里的清单安装 DeepSeek Harness、微信输入法和插件；账户和密钥用自己的。<\/p>\n<ol>\n<li>先完成 Harness 安装、模型设置和一条「连接成功」测试。<\/li>\n<li>按爸爸第 2 节安装微信输入法，找到语音输入快捷键。<\/li>\n<li>安装插件市场 <code>dshmarket<\/code> 和另外五个指定插件，逐项核对 Installed plugins 的开关。<\/li>\n<li>不安装 <code>dsh-ears<\/code>；语音输入统一用微信输入法。卡住时记下显示名称、版本和报错，下一节继续。<\/li>\n<\/ol><\/div>\n<\/div>\n<nav class=\"lesson-pager\" aria-label=\"课次导航\">\n<a class=\"pager-link\" href=\"#mom/lesson-05\"><span class=\"pager-label\">上一节<\/span><span class=\"pager-title\">第 5 节<\/span><\/a>\n<a class=\"pager-link pager-home\" href=\"#mom\"><span class=\"pager-label\">课表<\/span><span class=\"pager-title\">返回妈妈的课程<\/span><\/a>\n<a class=\"pager-link\" href=\"#mom/lesson-07\"><span class=\"pager-label\">下一节<\/span><span class=\"pager-title\">第 7 节<\/span><\/a>\n<\/nav>\n<\/div><\/article>"}, "mom/lesson-07": {"title": "推理强度、用量与查网页：按爸爸第 3 节做", "html": "<article class=\"lesson-page route-mom\"><div class=\"wrap\">\n<nav class=\"breadcrumb\" aria-label=\"面包屑\"><a href=\"#mom\">妈妈的课程<\/a><span aria-hidden=\"true\">/<\/span><span>第 7 节<\/span><\/nav>\n<header class=\"lesson-hero\">\n<p class=\"eyebrow\"><span lang=\"en-GB\">Lesson 07<\/span> · 妈妈 <\/p>\n<h1>推理强度、用量与查网页：按爸爸第 3 节做<\/h1><p class=\"lesson-summary\">按爸爸第 3 节：推理强度、用量与查网页/日历<\/p>\n<\/header>\n<div class=\"lesson-layout no-toc\">\n\n<div class=\"lesson-body\" id=\"mom\"><p>打开<a href=\"#dad/lesson-03\">爸爸第 3 节<\/a>，用同一道题比较推理强度，回开放平台看用量，再用 Harness 读公开网页和只读日历。<\/p>\n<ol>\n<li>在 Harness 里找到模型名和 Effort。<\/li>\n<li>用爸爸第 3 节的虚构行程题，分别用 low 和 high/max 各做一次。<\/li>\n<li>回 DeepSeek 开放平台核对两次请求的用量。<\/li>\n<li>用微信输入法口述一条提示词，按爸爸第 3 节读一条公开网页；日历只读，不创建或修改日程。<\/li>\n<\/ol><\/div>\n<\/div>\n<nav class=\"lesson-pager\" aria-label=\"课次导航\">\n<a class=\"pager-link\" href=\"#mom/lesson-06\"><span class=\"pager-label\">上一节<\/span><span class=\"pager-title\">第 6 节<\/span><\/a>\n<a class=\"pager-link pager-home\" href=\"#mom\"><span class=\"pager-label\">课表<\/span><span class=\"pager-title\">返回妈妈的课程<\/span><\/a>\n<span class=\"pager-link is-empty\" aria-hidden=\"true\"><\/span>\n<\/nav>\n<\/div><\/article>"}, "practice/github": {"title": "爸妈第一次用 GitHub", "html": "<article class=\"lesson-page page-practice\"><div class=\"wrap\">\n<nav class=\"breadcrumb\" aria-label=\"面包屑\"><a href=\"#home\">首页<\/a><span aria-hidden=\"true\">/<\/span><a href=\"#practice\">共同练习<\/a><span aria-hidden=\"true\">/<\/span><span>爸妈第一次用 GitHub<\/span><\/nav>\n<header class=\"lesson-hero\">\n<p class=\"eyebrow\">共同练习 · 备用<\/p>\n<h1>爸妈第一次用 GitHub<\/h1>\n<p class=\"lesson-summary\">备用：注册账号、建立私有仓库，用 Harness 完成第一次提交和推送。<\/p>\n<\/header>\n<div class=\"lesson-layout\">\n<aside class=\"toc\" aria-label=\"本节步骤\"><p class=\"toc-title\">本节步骤<\/p><nav class=\"toc-nav\"><a href=\"#step-1\"><span class=\"toc-num\">01<\/span><span>各自注册并登录<\/span><\/a><a href=\"#step-2\"><span class=\"toc-num\">02<\/span><span>新建仓库时，先看可见性<\/span><\/a><a href=\"#step-3\"><span class=\"toc-num\">03<\/span><span>认三个词，让 Harness 帮忙执行<\/span><\/a><\/nav><\/aside>\n<div class=\"lesson-body\" id=\"practice\"><h2 id=\"step-1\">1. 各自注册并登录<\/h2>\n<p>两人在自己的 Mac 上打开 <a href=\"https://github.com/signup\" target=\"_blank\" rel=\"noopener\">GitHub 注册页<\/a>，各自注册个人账号，按网页提示完成邮箱验证。登录后点右上角头像，确认用户名是自己的。登录、验证码和授权由本人完成，遇到卡点先停下来一起看。 <a href=\"https://docs.github.com/en/account-and-profile/how-tos/account-management/creating-an-account-on-github\" target=\"_blank\" rel=\"noopener\">GitHub 账号注册说明<\/a><\/p>\n<h2 id=\"step-2\">2. 新建仓库时，先看可见性<\/h2>\n<p>各自打开 <a href=\"https://github.com/new\" target=\"_blank\" rel=\"noopener\">新建 GitHub 仓库<\/a>，确认 Owner 是自己的账号。爸爸可取名 <code>technical-manual<\/code>，妈妈可取名 <code>my-first-repo<\/code>。课堂先选 <strong>Private<\/strong>，创建后检查仓库名称旁是否显示 Private。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>选项<\/th>\n<th>谁能看到<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Private（私有）<\/td>\n<td>自己和获授权的人。爸爸的手册和妈妈的小项目先用这个选项。<\/td>\n<\/tr>\n<tr>\n<td>Public（公开）<\/td>\n<td>任何人都可以查看仓库里的文件和公开提交历史。以后要公开自己的小项目时，再一起核对素材和发布范围。<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>私有仓库里也只放有权上传的文件。手册先选已确认可上传的 <code>.tex<\/code>、Markdown 规则和示例图表。账号信息、密钥、无权上传的内部资料留在本机。妈妈先用自己的一组虚构练习文件。 <a href=\"https://docs.github.com/en/repositories/creating-and-managing-repositories/about-repositories\" target=\"_blank\" rel=\"noopener\">GitHub 仓库可见性说明<\/a><\/p>\n<h2 id=\"step-3\">3. 认三个词，让 Harness 帮忙执行<\/h2>\n<p>本节默认已经装好 DeepSeek Harness（爸爸第 2 节、妈妈第 6 节）。<\/p>\n<ul>\n<li><strong>clone（克隆）<\/strong>：把 GitHub 仓库复制到电脑，得到可以编辑的本地项目。<\/li>\n<li><strong>commit（提交）<\/strong>：在本地保存一份带说明的版本记录。<\/li>\n<li><strong>push（推送）<\/strong>：把已提交的版本送到指定的 GitHub 仓库。<\/li>\n<\/ul>\n<ol>\n<li>在新仓库复制地址。各自在 Mac 选一个空练习位置，让 Harness 把仓库克隆到那里。若 GitHub 要求本机登录或授权，按提示由本人完成，再让 Harness 继续。<\/li>\n<li>打开克隆得到的文件夹。爸爸复制选好的手册文件，妈妈复制自己的 <code>index.html<\/code> 或那节课用到的练习文件。原来的本地项目仍可直接打开。复制前先看仓库里有没有 <code>.gitignore<\/code>；没有就建一个，至少排除 <code>.DS_Store<\/code>、密钥文件和私人草稿。<\/li>\n<li>用自然语言交代任务。先让 Harness 列出要上传的内容，自己检查后再同意推送。若 Harness 不能直接执行 git，就让它给出命令，由本人打开「终端」逐条执行并核对输出。<\/li>\n<\/ol>\n<blockquote>\n<p>这个本地文件夹来自我刚建立的私有 GitHub 仓库。请核对远端地址和仓库所有者，列出准备提交的文件、分支和提交说明。只提交我刚复制进去、确认可上传的项目文件。不要提交密钥、账号资料或私人原件。等我确认后再提交和推送。需要登录或权限时先停下来告诉我。<\/p>\n<\/blockquote>\n<ol start=\"4\">\n<li>回到浏览器刷新各自的仓库，检查仍显示 Private，文件和提交说明都出现了。爸爸打开一份手册源文件，妈妈打开 <code>index.html<\/code>。看得见文件，就完成了第一次推送。<\/li>\n<\/ol>\n<p><a href=\"https://docs.github.com/en/repositories/creating-and-managing-repositories/cloning-a-repository\" target=\"_blank\" rel=\"noopener\">克隆仓库<\/a> · <a href=\"https://docs.github.com/en/repositories/creating-and-managing-repositories/quickstart-for-repositories\" target=\"_blank\" rel=\"noopener\">提交和推送入门<\/a><\/p>\n<p>本节只练文件推送。以后要让家人从网址打开自己的页面时，再单独配置 GitHub Pages 和确认发布范围。 <a href=\"https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages\" target=\"_blank\" rel=\"noopener\">GitHub Pages 说明<\/a><\/p><\/div>\n<\/div>\n<nav class=\"lesson-pager\" aria-label=\"课次导航\">\n<a class=\"pager-link pager-home\" href=\"#practice\"><span class=\"pager-label\">共同练习<\/span><span class=\"pager-title\">返回共同练习<\/span><\/a>\n<a class=\"pager-link pager-home\" href=\"#dad\"><span class=\"pager-label\">爸爸<\/span><span class=\"pager-title\">返回爸爸的课表<\/span><\/a>\n<a class=\"pager-link pager-home\" href=\"#mom\"><span class=\"pager-label\">妈妈<\/span><span class=\"pager-title\">返回妈妈的课表<\/span><\/a>\n<\/nav>\n<\/div><\/article>"}, "practice/image-gen": {"title": "用 DeepSeek Harness 生成房间软装图", "html": "<article class=\"lesson-page page-practice\"><div class=\"wrap\">\n<nav class=\"breadcrumb\" aria-label=\"面包屑\"><a href=\"#home\">首页<\/a><span aria-hidden=\"true\">/<\/span><a href=\"#practice\">共同练习<\/a><span aria-hidden=\"true\">/<\/span><span>用 Harness 生成房间软装图<\/span><\/nav>\n<header class=\"lesson-hero\">\n<p class=\"eyebrow\">共同练习 · 建议安排<\/p>\n<h1>用 DeepSeek Harness 生成房间软装图<\/h1>\n<p class=\"lesson-summary\">建议安排：配置 Seedream / 火山方舟，跑通生图、改图和软装对比。<\/p>\n<\/header>\n<div class=\"lesson-layout\">\n<aside class=\"toc\" aria-label=\"本节步骤\"><p class=\"toc-title\">本节步骤<\/p><nav class=\"toc-nav\"><a href=\"#step-1\"><span class=\"toc-num\">01<\/span><span>先分清四个名字<\/span><\/a><a href=\"#step-2\"><span class=\"toc-num\">02<\/span><span>开通火山方舟和 Seedream<\/span><\/a><a href=\"#step-3\"><span class=\"toc-num\">03<\/span><span>安装并启用 dsh-image-gen<\/span><\/a><a href=\"#step-4\"><span class=\"toc-num\">04<\/span><span>配置 Seedream Provider<\/span><\/a><a href=\"#step-5\"><span class=\"toc-num\">05<\/span><span>第一张图：虚构客厅<\/span><\/a><a href=\"#step-6\"><span class=\"toc-num\">06<\/span><span>在原图上改：只换一处<\/span><\/a><a href=\"#step-7\"><span class=\"toc-num\">07<\/span><span>软装选品：三套方案与核对<\/span><\/a><a href=\"#step-8\"><span class=\"toc-num\">08<\/span><span>费用、隐私和故障排查<\/span><\/a><a href=\"#step-9\"><span class=\"toc-num\">09<\/span><span>验收清单<\/span><\/a><\/nav><\/aside>\n<div class=\"lesson-body\" id=\"practice\"><p>这一课只做一件事：把「用 DeepSeek Harness 生成图片」这条路跑通。先用虚构的客厅练手，再把自己的房间照片放在本机做软装方向的对比；生成图只当方向板，不当施工图，也不替代商品尺寸和材质核对。<\/p>\n<p>公开课稿只用虚构房间和示例文字；真实家庭照片、门牌、快递单和家人物品只在本机使用，上传前先裁掉隐私信息。<\/p>\n<h2 id=\"step-1\">1. 先分清四个名字<\/h2>\n<p>你之前提到的「C Dream」，官方资料写作 <strong>Seedream<\/strong>（也见 SeeDream），是字节跳动的图像生成模型。和它相关的几个入口不是一回事：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>名称<\/th>\n<th>是什么<\/th>\n<th>这一课怎么用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Seedream / SeeDream<\/strong><\/td>\n<td>字节跳动 Seed 团队的图像生成模型，支持文生图、参考图生图、局部编辑、组图<\/td>\n<td>本课要调用的模型<\/td>\n<\/tr>\n<tr>\n<td><strong>即梦 AI<\/strong><\/td>\n<td>消费端网页/App，使用 Seedream；会员/订阅是消费级入口<\/td>\n<td>可以自己玩，但<strong>不能<\/strong>直接给 DSH 插件当 API<\/td>\n<\/tr>\n<tr>\n<td><strong>火山方舟 Ark<\/strong><\/td>\n<td>火山引擎的模型 API 平台：开通模型、创建 API Key、按量计费<\/td>\n<td>本课必须走这条<\/td>\n<\/tr>\n<tr>\n<td><strong>dsh-image-gen<\/strong><\/td>\n<td>DeepSeek Harness 的生图插件，支持 Seedream / 火山方舟 Provider<\/td>\n<td>本课安装和配置的插件<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>关于“订阅”<\/strong>：即梦会员和火山方舟 API 是两条账本。DSH 插件要的是 Ark API Key，按生成张数计费；不需要先买即梦会员。火山引擎的 Agent Plan 是另一种订阅套餐，可能含部分 Seedream Lite 额度，但先确认它是否提供可用于 <code>/api/v3<\/code> 的 API Key，不要把它当成图片余额。若只想在网页里随手生成，才考虑即梦会员。<\/p>\n<h2 id=\"step-2\">2. 开通火山方舟和 Seedream<\/h2>\n<ol>\n<li>打开<a href=\"https://console.volcengine.com/ark/region:cn-beijing\" target=\"_blank\" rel=\"noopener\">火山方舟控制台<\/a>，用爸爸妈妈自己的火山引擎账号登录，按页面要求完成实名认证和开通。<\/li>\n<li>在模型广场或「开通管理」里找到 <strong>Seedream<\/strong>，开通要用的版本。课堂先用 <strong>Seedream 5.0 Lite<\/strong> 或 <strong>5.0 Pro<\/strong> 试，确认流程后再用 5.5 或更高分辨率。<\/li>\n<li>打开 <a href=\"https://console.volcengine.com/ark/region:cn-beijing/apiKey\" target=\"_blank\" rel=\"noopener\">API Key 管理<\/a>，创建一把只给这台 Mac 用的 Key，命名例如 <code>dsh-image-gen-dad<\/code> 或 <code>dsh-image-gen-mom<\/code>。先停止屏幕共享，由本人复制；Key 不写进聊天、截图或课程仓库。<\/li>\n<li>回到控制台确认计费方式和余额。API 是按量后付费；先在预算里留一小笔练习额度，开启用量/余额提醒。<\/li>\n<li>记下区域和端点。图片生成默认端点是 <code>https://ark.cn-beijing.volces.com/api/v3<\/code>；实际以控制台和插件“拉取模型”结果为准。<\/li>\n<\/ol>\n<p>当前常见模型 ID（以控制台/插件拉取结果为准）：<\/p>\n<ul>\n<li><code>doubao-seedream-5-5-261028<\/code>：Seedream 5.5，2026-11-09 发布，API 陆续开放；<\/li>\n<li><code>doubao-seedream-5-0-pro-260628<\/code>：Seedream 5.0 Pro，插件当前默认之一；<\/li>\n<li><code>doubao-seedream-5-0-260128<\/code> / <code>doubao-seedream-5-0-lite-260128<\/code>：Seedream 5.0 Lite。<\/li>\n<\/ul>\n<p>价格示例（2026-11-15 查到的官方口径，实际以下单页面为准）：Seedream 5.0 Pro 输出图不超过 236 万像素约 0.3 元/张，更大尺寸约 0.6 元/张；5.5 约 0.28 元/2K 方图编辑；Lite 更便宜。先用 Lite/1K 试构图，满意后用 Pro/5.5/2K。<\/p>\n<h2 id=\"step-3\">3. 安装并启用 dsh-image-gen<\/h2>\n<ol>\n<li>打开 DeepSeek Harness 左侧的「插件」面板，进入「已安装」或插件市场，搜索 <code>dsh-image-gen<\/code>。<\/li>\n<li>安装或启用后重启 Harness。插件详情页应出现「图像生成」配置表单；输入框旁也会出现生图按钮。<\/li>\n<li>不要照搬插件 README 里的 <code>--profile web<\/code> 命令到 Desktop；父母用界面安装即可。若界面找不到，先确认 Harness 版本，再让家人协助用插件管理。<\/li>\n<li>安装只需一次；以后升级插件后重新打开详情页检查 Provider 和模型是否还在。<\/li>\n<\/ol>\n<h2 id=\"step-4\">4. 配置 Seedream Provider<\/h2>\n<p>在插件详情页：<\/p>\n<ol>\n<li>默认 Provider 选 <strong>ByteDance Seedream / 火山方舟<\/strong>（界面可能显示「字节 Seedream」）。<\/li>\n<li>填入第 2 步创建的 API Key。<\/li>\n<li>Endpoint / Base URL 保持默认；若为空，填 <code>https://ark.cn-beijing.volces.com/api/v3<\/code>。<\/li>\n<li>模型先填 <code>doubao-seedream-5-0-pro-260628<\/code>，或点「拉取模型」后选可用的 5.5 / 5.0 Lite。<\/li>\n<li>点「测试连接」。通过后再点「拉取模型」核对模型列表；失败先看第 8 步的排错。<\/li>\n<li>设置输出格式（PNG/JPEG）、水印开关和保存工作区。水印是否可关以模型和条款为准；课堂先用默认。<\/li>\n<li>保存后，回到会话输入框旁确认 Provider 是 Seedream，不要误用 ChatGPT 订阅通道。<\/li>\n<\/ol>\n<p>密钥只保存在本机 DSH 凭据里；不要为了“方便”把 Key 写进课稿、仓库、聊天或截图。<\/p>\n<h2 id=\"step-5\">5. 第一张图：虚构客厅<\/h2>\n<p>先用一张虚构房间练提示词，不要上传真实家庭照片。要求写明：房间、固定不动的元素、要换的软装、光线、镜头和比例。<\/p>\n<div class=\"prompt\"><div class=\"prompt-head\"><span class=\"prompt-label\">提示词<\/span><button class=\"prompt-copy\" type=\"button\" aria-label=\"复制提示词\">复制<\/button><\/div><pre><code class=\"language-text\">请生成一张约 20 平方米客厅的软装示意：浅橡木地板，米白色墙，左侧落地窗，午后自然光；现有灰色布艺三人沙发、白色圆形茶几。请只把沙发换成浅米色亚麻三人沙发，增加胡桃木边柜和橄榄绿地毯；保留窗、墙、地板、光线和拍摄角度不变，其他家具不要移动。真实照片感，24mm 广角，1:1，不要添加文字。\n<\/code><\/pre><\/div>\n<p>生成后先看四件事：<\/p>\n<ul>\n<li>房间结构和窗/墙/地板有没有被改掉；<\/li>\n<li>沙发、边柜、地毯是不是你要的方向；<\/li>\n<li>光线、镜头角度是否还能和原房间对上；<\/li>\n<li>画面里有没有乱码文字或多余物件。<\/li>\n<\/ul>\n<p>不要一次要求“全部重新设计”。软装对比要控制变量，否则看不出是哪一件东西变了。<\/p>\n<h2 id=\"step-6\">6. 在原图上改：只换一处<\/h2>\n<p>打开 <code>画廊 → 工作台<\/code>，或在画布/图库里选中刚生成的图：<\/p>\n<ol>\n<li>点「继续编辑（垫图）」或把图拖进画布，作为参考图。<\/li>\n<li>用画笔圈出要改的区域（例如沙发），或在提示词里明确位置。<\/li>\n<li>发一条只改一处的修改意见：<\/li>\n<\/ol>\n<div class=\"prompt\"><div class=\"prompt-head\"><span class=\"prompt-label\">提示词<\/span><button class=\"prompt-copy\" type=\"button\" aria-label=\"复制提示词\">复制<\/button><\/div><pre><code class=\"language-text\">只改左侧沙发：换成浅米色亚麻三人沙发；保留窗帘、地板、光线、镜头角度、其他家具和房间结构不变。不要把整张图重新设计，不要添加文字。\n<\/code><\/pre><\/div>\n<ol start=\"4\">\n<li>生成后对比新旧两版，满意就保存为新版本；不满意就退回上一版再改，不要覆盖原图。<\/li>\n<li>再试一次“只换地毯”或“只换落地灯”，每次都只改一个变量。<\/li>\n<\/ol>\n<p>如果插件支持画布选区，优先圈出要改的地方再发指令；选区能让模型更清楚“只改这里”。如果当前通道的图生图不稳定，就先退回“文字重生成”，但把固定条件写得更具体。<\/p>\n<h2 id=\"step-7\">7. 软装选品：三套方案与核对<\/h2>\n<p>同一房间一次生成三套方向，每套只改变软装组合：<\/p>\n<div class=\"prompt\"><div class=\"prompt-head\"><span class=\"prompt-label\">提示词<\/span><button class=\"prompt-copy\" type=\"button\" aria-label=\"复制提示词\">复制<\/button><\/div><pre><code class=\"language-text\">同一间客厅，保留墙、窗、地板、主沙发、光线和镜头角度不变，分别生成三套软装方向：\nA：橄榄绿地毯 + 藤编落地灯 + 胡桃木边几；\nB：米色羊毛地毯 + 黑色细杆落地灯 + 浅木边柜；\nC：蓝灰地毯 + 黄铜落地灯 + 深色边几。\n每套单独一张图，真实照片感，1:1，不要添加文字。\n<\/code><\/pre><\/div>\n<p>拿去淘宝/店里选品时：<\/p>\n<ul>\n<li>先量墙面、沙发、柜子和通道尺寸，再看商品尺寸；生成图不保证比例。<\/li>\n<li>用生成图比较颜色、材质和风格，商品页的尺寸、材质、色差、安装方式和退货政策以商家为准。<\/li>\n<li>不要根据生成图判断“放得下”；放不下是尺寸问题，不是画面问题。<\/li>\n<li>真实房间照片只在本机使用；上传前裁掉门牌、家人照片、快递单等隐私信息；公开课稿只放虚构房间。<\/li>\n<li>生成图只作方向板，最终以实物、样板和小样为准。<\/li>\n<\/ul>\n<h2 id=\"step-8\">8. 费用、隐私和故障排查<\/h2>\n<p><strong>费用<\/strong><\/p>\n<ul>\n<li>按生成张数计费；先 Lite/1K 试构图，再用 Pro/5.5/2K 做最终图。<\/li>\n<li>在火山方舟控制台看用量、余额和账单；设预算提醒，避免一次批量生成过多。<\/li>\n<li>5.0 Pro 输出图 ≤236 万像素约 0.3 元/张，更大尺寸约 0.6 元/张；5.5 约 0.28 元/2K 编辑；以控制台为准。<\/li>\n<\/ul>\n<p><strong>隐私<\/strong><\/p>\n<ul>\n<li>API Key 不截图、不进聊天、不进仓库；只放本机 DSH 凭据。<\/li>\n<li>真实家庭照片不上传公开仓库；按火山方舟条款处理图片。<\/li>\n<li>课堂投屏时先停共享再粘贴 Key。<\/li>\n<\/ul>\n<p><strong>排错<\/strong><\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>现象<\/th>\n<th>先检查<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>401/403<\/td>\n<td>Key 是否复制完整；模型是否开通；账号是否欠费；实名/区域是否符合<\/td>\n<\/tr>\n<tr>\n<td>404 模型不存在<\/td>\n<td>模型 ID 是否过期；点「拉取模型」选当前 ID；5.5 是否已对该账号开放<\/td>\n<\/tr>\n<tr>\n<td>429<\/td>\n<td>触发限流；等一会儿，减少并发/批量<\/td>\n<\/tr>\n<tr>\n<td>测试连接失败<\/td>\n<td>Endpoint 是否 <code>/api/v3<\/code>；Key 是否属于当前区域；网络是否可访问火山方舟<\/td>\n<\/tr>\n<tr>\n<td>生成成功但看不到图<\/td>\n<td>图库/工作区保存位置；Provider 是否选对；刷新或重开插件<\/td>\n<\/tr>\n<tr>\n<td>中文小字乱码<\/td>\n<td>减少画面文字；重要文字后期另加，不依赖模型写小字<\/td>\n<\/tr>\n<tr>\n<td>改图改得太多<\/td>\n<td>提示词写“只改…、保留…”，用选区圈定；降低一次修改数量<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"step-9\">9. 验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"task-box\" aria-hidden=\"true\"><\/span><span class=\"task-text\">能说清 Seedream、即梦、火山方舟和 dsh-image-gen 的区别。<\/span><\/li>\n<li class=\"task\"><span class=\"task-box\" aria-hidden=\"true\"><\/span><span class=\"task-text\">火山方舟账号已开通 Seedream，API Key 只保存在本机。<\/span><\/li>\n<li class=\"task\"><span class=\"task-box\" aria-hidden=\"true\"><\/span><span class=\"task-text\">dsh-image-gen 已安装并启用，Provider 选 ByteDance Seedream / 火山方舟。<\/span><\/li>\n<li class=\"task\"><span class=\"task-box\" aria-hidden=\"true\"><\/span><span class=\"task-text\">「测试连接」通过，「拉取模型」能看到可用模型。<\/span><\/li>\n<li class=\"task\"><span class=\"task-box\" aria-hidden=\"true\"><\/span><span class=\"task-text\">用虚构客厅生成至少一张图，能说出模型、尺寸和大约费用。<\/span><\/li>\n<li class=\"task\"><span class=\"task-box\" aria-hidden=\"true\"><\/span><span class=\"task-text\">在原图上只改一处（沙发/地毯/灯），保存新版本，原图还在。<\/span><\/li>\n<li class=\"task\"><span class=\"task-box\" aria-hidden=\"true\"><\/span><span class=\"task-text\">生成三套软装方向，能说清哪些是画面方向、哪些必须去商品页核对尺寸和材质。<\/span><\/li>\n<li class=\"task\"><span class=\"task-box\" aria-hidden=\"true\"><\/span><span class=\"task-text\">真实照片没有上传公开仓库；API Key 没有进截图、聊天或课稿。<\/span><\/li>\n<\/ul>\n<h3>备查<\/h3>\n<ul>\n<li><a href=\"https://docs.volcengine.com/docs/ark/seedream-5-5?lang=zh\" target=\"_blank\" rel=\"noopener\">Seedream 5.5 教程<\/a><\/li>\n<li><a href=\"https://docs.volcengine.com/docs/ark/seedream-5-0-pro?lang=zh\" target=\"_blank\" rel=\"noopener\">Seedream 5.0 Pro 教程<\/a><\/li>\n<li><a href=\"https://docs.volcengine.com/docs/ark/image-generation-tutorial?lang=zh\" target=\"_blank\" rel=\"noopener\">图片生成教程<\/a><\/li>\n<li><a href=\"https://docs.volcengine.com/docs/ark/model-pricing?lang=zh\" target=\"_blank\" rel=\"noopener\">模型价格<\/a><\/li>\n<li><a href=\"https://console.volcengine.com/ark/region:cn-beijing/apiKey\" target=\"_blank\" rel=\"noopener\">API Key 管理<\/a><\/li>\n<li><a href=\"https://github.com/shanliuling/dsh-image-gen\" target=\"_blank\" rel=\"noopener\">dsh-image-gen 插件<\/a><\/li>\n<\/ul><\/div>\n<\/div>\n<nav class=\"lesson-pager\" aria-label=\"课次导航\">\n<a class=\"pager-link pager-home\" href=\"#practice\"><span class=\"pager-label\">共同练习<\/span><span class=\"pager-title\">返回共同练习<\/span><\/a>\n<a class=\"pager-link pager-home\" href=\"#dad\"><span class=\"pager-label\">爸爸<\/span><span class=\"pager-title\">返回爸爸的课表<\/span><\/a>\n<a class=\"pager-link pager-home\" href=\"#mom\"><span class=\"pager-label\">妈妈<\/span><span class=\"pager-title\">返回妈妈的课表<\/span><\/a>\n<\/nav>\n<\/div><\/article>"}, "practice": {"title": "共同练习", "html": "<section class=\"hero hero-route\"><div class=\"wrap\">\n<p class=\"eyebrow\">共同练习<\/p>\n<h1>共同练习<\/h1>\n<p class=\"lead\">两项共用练习，不占爸爸妈妈的课号。GitHub 先备用；Seedream 生图建议安排，用来跑通 Harness 生图、改图和软装对比。<\/p>\n<\/div><\/section>\n<section class=\"wrap lesson-section\">\n<div class=\"practice-grid\"><a class=\"practice-card\" href=\"#practice/github\">\n<p class=\"eyebrow\">共同练习 · 备用<\/p>\n<h2>爸妈第一次用 GitHub<\/h2>\n<p>备用：注册账号、建立私有仓库，用 Harness 完成第一次提交和推送。<\/p>\n<span class=\"route-enter\">打开练习 <span aria-hidden=\"true\">→<\/span><\/span>\n<\/a><a class=\"practice-card\" href=\"#practice/image-gen\">\n<p class=\"eyebrow\">共同练习 · 建议安排<\/p>\n<h2>用 Harness 生成房间软装图<\/h2>\n<p>建议安排：配置 Seedream / 火山方舟，跑通生图、改图和软装对比。<\/p>\n<span class=\"route-enter\">打开练习 <span aria-hidden=\"true\">→<\/span><\/span>\n<\/a><\/div>\n<\/section>"}}</script>
<script>
(function () {
  var views = JSON.parse(document.getElementById("views-data").textContent);
  var root = document.getElementById("view-root");
  var current = "";
  function keyFromHash() { return decodeURIComponent(location.hash.slice(1)); }
  function render(key, anchor) {
    if (!views[key]) key = "home";
    root.innerHTML = views[key].html;
    document.title = views[key].title + " · 爸妈的 Mac 与 AI 课";
    document.body.className = "page-annotate" + (key.indexOf("mom") === 0 ? " route-mom" : "");
    current = key;
    try { sessionStorage.setItem("annotate-view", key); } catch (error) {}
    if (anchor) {
      var node = document.getElementById(anchor);
      if (node) { node.scrollIntoView(); return; }
    }
    window.scrollTo(0, 0);
  }
  function route() {
    var raw = keyFromHash();
    if (views[raw]) { render(raw); return; }
    if (raw && current && document.getElementById(raw)) {
      document.getElementById(raw).scrollIntoView();
      return;
    }
    var last = "";
    try { last = sessionStorage.getItem("annotate-view") || ""; } catch (error) {}
    render(views[last] ? last : "home", raw);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
